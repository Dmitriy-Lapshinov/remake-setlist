<body>
<main>
<div class="sticky-top"><header class="app-header"><h1>Собери программу выступления</h1><p class="subtitle">Стандартная программа — 90 минут (1 ч 30 мин): 3 выхода по 30 минут или 2 по 45 минут.</p></header><div class="actions"><button class="button primary" id="copyList" type="button">Скопировать список</button><button class="button" id="downloadList" type="button">Скачать .txt</button></div>
<section class="summary" aria-label="Итоги выбора"><div class="stat"><span class="stat-label">Выбрано песен</span><span class="stat-value" id="songCount">0</span></div><div class="stat"><span class="stat-label">Общее время</span><span class="stat-value" id="totalTime">0:00</span></div></section>

<section class="setlist" id="setlistPanel"><div class="setlist-heading"><button class="collapse-title" id="toggleSetlist" type="button" aria-expanded="false" aria-controls="selectedSongs"><span>Итоговый список</span><span class="chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg></span></button></div><div id="selectedSongs" hidden></div></section></div>
<div class="catalog-gap" aria-hidden="true"></div><div class="catalog-heading" id="catalogHeading"><div class="section-title catalog-section-title" style="margin:0"><span>Каталог песен</span><button class="clear" id="clearSelection" type="button">Снять выбор</button></div><div class="catalog-selection-summary" id="selectionSummary">выбрано 0 песен · 0:00</div><div class="toolbar"><div class="search-wrap"><input class="search" id="search" type="search" placeholder="Найти песню или исполнителя…" aria-label="Поиск по песням" enterkeyhint="search"><button class="search-clear" id="clearSearch" type="button" aria-label="Очистить поиск" hidden>×</button></div></div><div class="filter-strip" id="filterStrip"><div class="filter-fixed"><button class="filter-icon" id="orderFilter" type="button" aria-label="Порядок: А—Я" title="Изменить порядок"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16m0 0-4-4m4 4 4-4M17 20V4m0 0-4 4m4-4 4 4"/></svg><span id="orderValue">А—Я</span></button><button class="filter-icon" id="fieldFilter" type="button" aria-label="Сортировать по: Исполнитель" title="Изменить поле сортировки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg><span id="fieldValue">Исполнитель</span></button></div><div class="collection-filter-wrap" id="collectionFilterWrap" hidden><button class="filter-icon" id="collectionFilter" type="button" aria-label="Подборки" aria-expanded="false" aria-controls="collectionMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg><span id="collectionFilterLabel">Подборки</span></button><div class="collection-menu" id="collectionMenu" role="group" aria-label="Выбор подборок" hidden><div class="collection-menu-head"><span>Подборки</span><button class="collection-reset" id="clearCollections" type="button">Сбросить</button></div><label class="collection-option"><input type="checkbox" value="russian-modern-pop"><span>Русский современный поп</span></label><label class="collection-option"><input type="checkbox" value="russian-pop-90-00"><span>Русский поп 90/00-е</span></label><label class="collection-option"><input type="checkbox" value="all-time-hits"><span>Хиты на все времена</span></label><label class="collection-option"><input type="checkbox" value="russian-rock"><span>Русский рок</span></label><label class="collection-option"><input type="checkbox" value="foreign"><span>Зарубежные</span></label></div></div></div></div></div><div class="song-list" id="songList"></div>
<section class="suggestion-box" aria-labelledby="suggestionTitle"><h2 id="suggestionTitle">Не нашли свою любимую песню?</h2><p>Предложите свой вариант.</p><form class="suggestion-form" id="suggestionForm"><label class="visually-hidden" for="suggestionInput">Название песни и исполнитель</label><input id="suggestionInput" type="text" maxlength="180" autocomplete="off" placeholder="Исполнитель — название песни"><button class="button primary" type="submit">Добавить</button></form></section>
</main><button class="scroll-top" id="scrollToTop" type="button" aria-label="Наверх" title="Наверх"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7"/></svg></button><div class="toast" id="toast" role="status"></div>
<script>const storageKey='remake-setlist-yandex-v1';
const layoutStorageKey='remake-setlist-layout-v1';\nconst suggestionsStorageKey='remake-setlist-suggestions-v1';
let songs=[];
let setlistItems=[];
let catalogLoading=true,catalogError='';
function songKey(song){return song.isSuggestion?'suggestion:'+song.id:[song.artist,song.title].join(String.fromCharCode(0))}
function readSavedSelections(){try{const saved=JSON.parse(localStorage.getItem(storageKey));return new Map(Array.isArray(saved)?saved.map(song=>[songKey(song),Boolean(song.selected)]):[])}catch{return new Map()}}
function readSavedLayout(){try{const saved=JSON.parse(localStorage.getItem(layoutStorageKey));return Array.isArray(saved)?saved:null}catch{return null}}
function readSuggestions(){try{const saved=JSON.parse(localStorage.getItem(suggestionsStorageKey));return Array.isArray(saved)?saved.filter(song=>song&&song.isSuggestion&&song.id&&typeof song.title==='string'&&song.title.trim()).map(song=>({...song,artist:'',seconds:210,selected:true})):[]}catch{return[]}}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(songs));localStorage.setItem(suggestionsStorageKey,JSON.stringify(songs.filter(song=>song.isSuggestion&&song.selected)))}catch{}}
function saveLayout(){try{localStorage.setItem(layoutStorageKey,JSON.stringify(setlistItems))}catch{}}
function parseDuration(value){const parts=String(value).trim().split(':').map(Number);if(parts.some(n=>!Number.isInteger(n)||n<0))return null;if(parts.length===2&&parts[1]<60)return parts[0]*60+parts[1];if(parts.length===3&&parts[1]<60&&parts[2]<60)return parts[0]*3600+parts[1]*60+parts[2];return null}
function parseRepertoire(text){const result=[];for(const [index,raw] of String(text).replace(/^\uFEFF/,'').split(/\r?\n/).entries()){const line=raw.trim();if(!line||line.startsWith('#'))continue;const fields=line.split('|').map(value=>value.trim());if(fields.length!==3||!fields[0]||!fields[1])throw new Error(`Строка ${index+1}: используйте формат Исполнитель | Название песни | М:СС`);const seconds=parseDuration(fields[2]);if(seconds===null)throw new Error(`Строка ${index+1}: длительность должна быть в формате М:СС`);result.push({artist:fields[0],title:fields[1],seconds,selected:false})}if(!result.length)throw new Error('В repertoire.txt нет песен');return result}
function formatDuration(seconds){seconds=Math.max(0,Math.round(seconds));const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function songWord(n){const lastTwo=n%100,last=n%10;return last===1&&lastTwo!==11?'песня':last>=2&&last<=4&&(lastTwo<12||lastTwo>14)?'песни':'песен'}
const songList=document.getElementById('songList'),selectedSongs=document.getElementById('selectedSongs'),search=document.getElementById('search'),setlistPanel=document.getElementById('setlistPanel'),toggleSetlist=document.getElementById('toggleSetlist'),stickyTop=document.querySelector('.sticky-top'),catalogHeading=document.getElementById('catalogHeading');

let sortField='artist',sortOrder='asc';const orderFilter=document.getElementById('orderFilter'),fieldFilter=document.getElementById('fieldFilter');function syncSortControls(){const orderLabel=sortOrder==='asc'?'А—Я':'Я—А',fieldLabel=sortField==='artist'?'Исполнитель':'Название';document.getElementById('orderValue').textContent=orderLabel;document.getElementById('fieldValue').textContent=fieldLabel;orderFilter.setAttribute('aria-label',`Порядок: ${orderLabel}`);fieldFilter.setAttribute('aria-label',`Сортировать по: ${fieldLabel}`)}orderFilter.addEventListener('click',()=>{sortOrder=sortOrder==='asc'?'desc':'asc';syncSortControls();render()});fieldFilter.addEventListener('click',()=>{sortField=sortField==='artist'?'title':'artist';syncSortControls();render()});syncSortControls();
function updateCatalogStickyOffset(){document.documentElement.style.setProperty('--sticky-top-height','0px');document.documentElement.style.setProperty('--catalog-heading-height',`${catalogHeading.getBoundingClientRect().height}px`)}
updateCatalogStickyOffset();
if('ResizeObserver' in window){const stickyObserver=new ResizeObserver(updateCatalogStickyOffset);stickyObserver.observe(stickyTop);stickyObserver.observe(catalogHeading)}
let setlistExpanded=false;
toggleSetlist.addEventListener('click',()=>{setlistExpanded=!setlistExpanded;selectedSongs.hidden=!setlistExpanded;toggleSetlist.setAttribute('aria-expanded',String(setlistExpanded));setlistPanel.classList.toggle('expanded',setlistExpanded)});

function render(){const q=search.value.trim().toLocaleLowerCase('ru');const ordered=orderedSongs().filter(song=>!song.isSuggestion),visible=ordered.filter(song=>`${song.title} ${song.artist}`.toLocaleLowerCase('ru').includes(q));songList.replaceChildren();if(catalogLoading){songList.innerHTML='<div class="empty">Загружаю репертуар…</div>'}else if(catalogError){const message=document.createElement('div');message.className='empty';message.textContent=`Не удалось загрузить каталог: ${catalogError}`;const retry=document.createElement('button');retry.className='button';retry.type='button';retry.textContent='Повторить загрузку';retry.style.marginTop='12px';retry.addEventListener('click',loadRepertoire);message.append(document.createElement('br'),retry);songList.append(message)}else if(!visible.length)songList.innerHTML='<div class="empty">Песни не найдены</div>';for(const song of visible){const row=document.createElement('label');row.className=`song${song.selected?' selected':''}`;const check=document.createElement('input');check.type='checkbox';check.checked=!!song.selected;check.setAttribute('aria-label',`Выбрать ${song.title}`);check.addEventListener('change',()=>{song.selected=check.checked;syncSetlistItems();save();render()});const info=document.createElement('div');info.className='song-main';const name=document.createElement('div');name.className='song-name';name.textContent=sortField==='artist'?song.artist:song.title;const artist=document.createElement('div');artist.className='song-artist';artist.textContent=sortField==='artist'?song.title:song.artist;info.append(name,artist);const time=document.createElement('span');time.className='duration';time.textContent=formatDuration(song.seconds);time.setAttribute('aria-label',`Длительность песни ${formatDuration(song.seconds)}`);row.append(check,info,time);songList.append(row)}const chosen=songs.filter(song=>song.selected),total=chosen.reduce((sum,song)=>sum+Number(song.seconds||0),0);document.getElementById('songCount').t const clearSearch=document.getElementById('clearSearch');function handleSearch(){clearSearch.hidden=!search.value;render()}clearSearch.addEventListener('click',()=>{search.value='';handleSearch();search.focus()});search.addEventListener('input',handleSearch);search.addEventListener('search',handleSearch);search.addEventListener('change',handleSearch);search.addEventListener('keyup',handleSearch);search.addEventListener('compositionend',handleSearch);search.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();search.blur()}else if(event.key==='Escape'){search.value='';handleSearch();search.blur()}});const searchToolbar=search.closest('.toolbar');function syncKeyboardDock(){const viewport=window.visualViewport;const keyboardInset=viewport?Math.max(0,window.innerHeight-viewport.height-viewport.offsetTop):0;document.documentElement.style.setProperty('--keyboard-inset',`${keyboardInset}px`);searchToolbar.classList.toggle('keyboard-docked',document.activeElement===search&&keyboardInset>100)}search.addEventListener('focus',syncKeyboardDock);const collectionFilter=document.getElementById('collectionFilter'),collectionMenu=document.getElementById('collectionMenu'),collectionWrap=document.getElementById('collectionFilterWrap'),collectionLabel=document.getElementById('collectionFilterLabel'),collectionChecks=[...collectionMenu.querySelectorAll('input[type="checkbox"]')],selectedCollections=new Set();function syncCollectionSelection(){const count=selectedCollections.size;collectionLabel.textContent=count?'Подборки · '+count:'Подборки';collectionFilter.setAttribute('aria-label',count?'Подборки: выбрано '+count:'Подборки')}function positionCollectionMenu(){const rect=collectionFilter.getBoundingClientRect(),gap=8,margin=12,desired=300,viewportHeight=window.visualViewport?.height||window.innerHeight,below=viewportHeight-rect.bottom-gap-margin,above=rect.top-gap-margin,opensUp=below<Math.min(desired,220)&&above>below,available=Math.max(120,Math.min(desi
