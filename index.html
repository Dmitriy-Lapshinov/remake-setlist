/* Keep the intro text visible and let the catalog follow it without a spacer. */
.app-header{display:block;height:auto;min-height:0;overflow:visible;margin:3px 0 0!important;padding:0!important}
.app-header h1{display:block;height:auto;max-height:none;overflow:visible}
.app-header .subtitle{display:block!important;visibility:visible!important;opacity:1!important;height:auto!important;max-height:none!important;margin:6px 0 0!important;color:var(--muted)}
.catalog-gap{height:0!important;margin:0!important;padding:0!important}

/* The sticky catalog backdrop must not cover the intro above it. */
.catalog-heading::before{content:none!important;display:none!important}

/* Motion-inspired visual refresh: charcoal surfaces, crisp type, calm spring-like feedback. */
:root{
 color-scheme:dark;
 --app-bg:#000;
 --panel:#1b1b1b;
 --panel2:#252525;
 --text:#f5f5f7;
 --muted:#98989f;
 --accent:#3b82f6;
 --accent-text:#fff;
 --line:rgba(255,255,255,.11);
 --danger:#ff5b63;
 --card-radius:22px;
}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#000}
main{padding-top:20px}
.sticky-top,.catalog-heading{background:#000}
.stat,.setlist,.suggestion-box,.song-list,.empty,.fixed-dock{background:#1b1b1b}
.stat{padding:16px 18px;border-radius:22px}
.stat-value{font-size:24px}
.search{background:#1b1b1b;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:13px 44px 13px 15px}
.search::placeholder{font-family:Inter,-apple-system,sans-serif}
.button,.primary{border-radius:16px;transition:transform .28s cubic-bezier(.2,.8,.2,1),background-color .28s,color .28s,opacity .2s}
.button{background:#252525}
.primary{background:#3b82f6}
.button:active,.primary:active,.filter-icon:active,.collapse-title:active{transform:scale(.985)}
.filter-icon{min-height:42px;padding:0 12px;background:#1b1b1b;border-color:rgba(255,255,255,.13);transition:transform .28s cubic-bezier(.2,.8,.2,1),background-color .2s}
.song-list{gap:1px;border-radius:22px}
.song{min-height:68px;padding:11px 14px;background:#1b1b1b;transition:background-color .28s cubic-bezier(.2,.8,.2,1)}
.song.selected{background:rgba(59,130,246,.16)}
.song-name{font-size:15px;font-weight:600;letter-spacing:-.01em}
.duration{font-size:13px}
.setlist,.suggestion-box{border-radius:22px}
.setlist-item,.setlist-song-content{min-height:62px}
.setlist-set{background:rgba(59,130,246,.12)}
.setlist-set-title,.bottom-set-heading{color:#69a4ff}
.collection-menu{background:#1b1b1b;border-color:rgba(255,255,255,.13);border-radius:18px;box-shadow:0 18px 48px rgba(0,0,0,.55)}
.fixed-dock{background:rgba(12,12,12,.94);border:1px solid rgba(255,255,255,.08);border-bottom:0;border-radius:26px 26px 0 0;box-shadow:0 -12px 36px rgba(0,0,0,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.collapse-title{font-size:16px}
.suggestion-form input{background:#101010;border-color:rgba(255,255,255,.12);border-radius:14px}
.toast{background:#252525;border-color:rgba(255,255,255,.12);box-shadow:0 10px 28px rgba(0,0,0,.4)}
.scroll-top{box-shadow:0 8px 24px rgba(59,130,246,.32);transition:opacity .22s,transform .32s cubic-bezier(.2,.8,.2,1),background-color .2s}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}


/* Cover scrolled content behind the Telegram chrome while the catalog is pinned. */
body.catalog-stuck::before{content:"";position:fixed;z-index:39;top:0;left:0;right:0;height:var(--catalog-cover-height,0px);background:var(--app-bg);pointer-events:none}

.history-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;grid-column:1/-1;margin:0 0 10px;padding:4px;background:var(--panel2);border-radius:999px}.history-switch button{min-height:34px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:600 13px/1.2 Inter,system-ui,sans-serif}.history-switch button.active{background:var(--panel);color:var(--text);box-shadow:0 1px 4px #0002}.history-empty{grid-column:1/-1;padding:14px 12px;color:var(--muted);font-size:13px;line-height:1.45}.history-card{grid-column:1/-1;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.history-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.history-card-info{min-width:0}.history-card-date{color:var(--text);font-size:13px;font-weight:650}.history-card-meta{margin-top:2px;color:var(--muted);font-size:12px}.history-restore{flex:0 0 auto;padding:7px 10px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-text);font:600 12px/1 Inter,system-ui,sans-serif}
/* Keep the scroll-to-top control inside the pinned catalog controls. */
.scroll-top{position:static;right:auto;bottom:auto;z-index:auto;display:none;place-items:center;flex:0 0 36px;width:36px;height:36px;margin-left:auto;padding:0;color:var(--accent);background:var(--panel);border:1px solid var(--line);border-radius:50%;box-shadow:none;opacity:1;pointer-events:auto;transform:none;transition:background .15s}.scroll-top.visible{display:grid;opacity:1;pointer-events:auto;transform:none}.scroll-top svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}#fieldFilter{background:color-mix(in srgb,var(--accent) 12%,var(--panel));border-color:color-mix(in srgb,var(--accent) 42%,var(--line))}
@media(max-width:600px){body.catalog-stuck #clearSelection{min-width:36px;width:36px;justify-content:center;padding-inline:0}body.catalog-stuck #clearSelection span{display:none}}
</style>
</head>
<body>
<main>
<div class="sticky-top"><header class="app-header"><h1>Собери программу выступления</h1><p class="subtitle">Стандартная программа — 90 минут (1 ч 30 мин): 3 выхода по 30 минут или 2 по 45 минут.</p></header><div class="actions"><button class="button primary share-button" id="sendList" type="button"><svg class="share-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.7 10.7 6.6-4.4M8.7 13.3l6.6 4.4"></path></svg>Поделиться</button><button class="button copy-button" id="copyList" type="button"><svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path></svg>Копировать</button></div>
<section class="summary" aria-label="Итоги выбора"><div class="stat"><span class="stat-label">Выбрано песен</span><span class="stat-value" id="songCount">0</span></div><div class="stat"><span class="stat-label">Общее время</span><span class="stat-value" id="totalTime">0:00</span></div></section>

<section class="setlist" id="setlistPanel"><div class="setlist-heading"><button class="collapse-title" id="toggleSetlist" type="button" aria-expanded="false" aria-controls="selectedSongs"><span>Итоговый список</span><span class="chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg></span></button></div><div id="selectedSongs" hidden></div></section></div>
<div class="catalog-gap" aria-hidden="true"></div><div class="catalog-heading" id="catalogHeading"><div class="section-title catalog-section-title" style="margin:0"><span>Каталог песен</span></div><div class="catalog-selection-summary" id="selectionSummary">выбрано 0 песен · 0:00</div><div class="toolbar"><div class="search-wrap"><input class="search" id="search" type="search" placeholder="Найти песню или исполнителя…" aria-label="Поиск по песням" enterkeyhint="search"><button class="search-clear" id="clearSearch" type="button" aria-label="Очистить поиск" hidden>×</button></div></div><div class="filter-strip" id="filterStrip"><div class="filter-fixed"><button class="filter-icon" id="orderFilter" type="button" aria-label="Порядок: А—Я" title="Изменить порядок"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16m0 0-4-4m4 4 4-4M17 20V4m0 0-4 4m4-4 4 4"/></svg><span id="orderValue">А—Я</span></button><button class="filter-icon" id="fieldFilter" type="button" aria-label="Сортировать по: По исполнителю" title="Изменить поле сортировки" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg><span id="fieldValue">По исполнителю</span></button></div><button class="filter-icon clear-filter" id="clearSelection" type="button" aria-label="Снять выбор" title="Снять выбор"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg><span>Снять выбор</span></button><button class="scroll-top" id="scrollToTop" type="button" aria-label="Наверх" title="Наверх"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7"/></svg></button><div class="collection-filter-wrap" id="collectionFilterWrap" hidden><button class="filter-icon" id="collectionFilter" type="button" aria-label="Подборки" aria-expanded="false" aria-controls="collectionMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="18" r="2"/></svg><span id="collectionFilterLabel">Подборки</span></button><div class="collection-menu" id="collectionMenu" role="group" aria-label="Выбор подборок" hidden><div class="collection-menu-head"><span>Подборки</span><button class="collection-reset" id="clearCollections" type="button">Сбросить</button></div><label class="collection-option"><input type="checkbox" value="russian-modern-pop"><span>Русский современный поп</span></label><label class="collection-option"><input type="checkbox" value="russian-pop-90-00"><span>Русский поп 90/00-е</span></label><label class="collection-option"><input type="checkbox" value="all-time-hits"><span>Хиты на все времена</span></label><label class="collection-option"><input type="checkbox" value="russian-rock"><span>Русский рок</span></label><label class="collection-option"><input type="checkbox" value="foreign"><span>Зарубежные</span></label></div></div></div></div></div><div class="song-list" id="songList"></div>
<div class="fixed-dock" id="fixedDock"><details class="suggestion-box" aria-labelledby="suggestionTitle"><summary><h2 id="suggestionTitle">Не нашли любимую песню?</h2><span class="chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg></span></summary><div class="suggestion-content"><p>Предложите свой вариант (не больше двух новых песен).</p><form class="suggestion-form" id="suggestionForm"><label class="visually-hidden" for="suggestionInput">Название песни и исполнитель</label><input id="suggestionInput" type="text" maxlength="180" autocomplete="off" placeholder="Исполнитель — название песни"><button class="button primary" type="submit">Добавить</button></form><ol class="suggested-tracks" id="suggestedTracks" aria-live="polite" hidden></ol></div></details><section class="bottom-repeat" id="bottomRepeat" aria-label="Итоги и действия"><section class="setlist" id="bottomSetlist"><div class="setlist-heading"><button class="collapse-title" id="toggleBottomSetlist" type="button" aria-expanded="false" aria-controls="bottomSelectedSongs"><span>Итоговый список</span><span class="chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg></span></button></div><div class="bottom-selected" id="bottomSelectedSongs" hidden></div></section><div class="actions bottom-actions"><button class="button primary share-button" id="sendListBottom" type="button"><svg class="share-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.7 10.7 6.6-4.4M8.7 13.3l6.6 4.4"></path></svg>Поделиться</button><button class="button copy-button" id="copyListBottom" type="button"><svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path></svg>Копировать</button></div></section></div>
</main><div class="toast" id="toast" role="status"></div>
<script>const storageKey='remake-setlist-yandex-v1';
const layoutStorageKey='remake-setlist-layout-v1';
const suggestionsStorageKey='remake-setlist-suggestions-v1';
const setlistHistoryStorageKey='remake-setlist-history-v1';
let songs=[];
let setlistItems=[];
let catalogLoading=true,catalogError='';
let setlistHistory=readSetlistHistory(),bottomListView='current';
function songKey(song){return song.isSuggestion?'suggestion:'+song.id:[song.artist,song.title].join(String.fromCharCode(0))}
function readSetlistHistory(){try{const saved=JSON.parse(localStorage.getItem(setlistHistoryStorageKey));return Array.isArray(saved)?saved.filter(item=>item&&Array.isArray(item.songs)&&Array.isArray(item.items)&&item.savedAt).slice(0,3):[]}catch{return[]}}
function saveSetlistHistory(){const selected=songs.filter(song=>song.selected);if(!selected.length)return;const savedSongs=selected.map(song=>({...song,selected:true})),keys=new Set(savedSongs.map(songKey)),items=setlistItems.filter(item=>item.type==='set'||item.type==='song'&&keys.has(item.key)).map(item=>({...item}));const snapshot={savedAt:new Date().toISOString(),songs:savedSongs,items};const signature=JSON.stringify({songs:savedSongs,items});setlistHistory=[snapshot,...setlistHistory.filter(item=>JSON.stringify({songs:item.songs,items:item.items})!==signature)].slice(0,3);try{localStorage.setItem(setlistHistoryStorageKey,JSON.stringify(setlistHistory))}catch{}}

function readSavedSelections(){try{const saved=JSON.parse(localStorage.getItem(storageKey));return new Map(Array.isArray(saved)?saved.map(song=>[songKey(song),Boolean(song.selected)]):[])}catch{return new Map()}}
function readSavedLayout(){try{const saved=JSON.parse(localStorage.getItem(layoutStorageKey));return Array.isArray(saved)?saved:null}catch{return null}}
function readSuggestions(){try{const saved=JSON.parse(localStorage.getItem(suggestionsStorageKey));return Array.isArray(saved)?saved.filter(song=>song&&song.isSuggestion&&song.id&&typeof song.title==='string'&&song.title.trim()).map(song=>({...song,artist:'',seconds:210,selected:true})):[]}catch{return[]}}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(songs));localStorage.setItem(suggestionsStorageKey,JSON.stringify(songs.filter(song=>song.isSuggestion&&song.selected)))}catch{}}
function saveLayout(){try{localStorage.setItem(layoutStorageKey,JSON.stringify(setlistItems))}catch{}}
function parseDuration(value){const parts=String(value).trim().split(':').map(Number);if(parts.some(n=>!Number.isInteger(n)||n<0))return null;if(parts.length===2&&parts[1]<60)return parts[0]*60+parts[1];if(parts.length===3&&parts[1]<60&&parts[2]<60)return parts[0]*3600+parts[1]*60+parts[2];return null}
function parseRepertoire(text){const result=[];for(const [index,raw] of String(text).replace(/^\uFEFF/,'').split(/\r?\n/).entries()){const line=raw.trim();if(!line||line.startsWith('#'))continue;const fields=line.split('|').map(value=>value.trim());if(fields.length!==3||!fields[0]||!fields[1])throw new Error(`Строка ${index+1}: используйте формат Исполнитель | Название песни | М:СС`);const seconds=parseDuration(fields[2]);if(seconds===null)throw new Error(`Строка ${index+1}: длительность должна быть в формате М:СС`);result.push({artist:fields[0],title:fields[1],seconds,selected:false})}if(!result.length)throw new Error('В repertoire.txt нет песен');return result}
function formatDuration(seconds){seconds=Math.max(0,Math.round(seconds));const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function songWord(n){const lastTwo=n%100,last=n%10;return last===1&&lastTwo!==11?'песня':last>=2&&last<=4&&(lastTwo<12||lastTwo>14)?'песни':'песен'}
const songList=document.getElementById('songList'),selectedSongs=document.getElementById('selectedSongs'),bottomSelectedSongs=document.getElementById('bottomSelectedSongs'),search=document.getElementById('search'),setlistPanel=document.getElementById('setlistPanel'),toggleSetlist=document.getElementById('toggleSetlist'),stickyTop=document.querySelector('.sticky-top'),catalogHeading=document.getElementById('catalogHeading');

let sortField='artist',sortOrder='asc';const orderFilter=document.getElementById('orderFilter'),fieldFilter=document.getElementById('fieldFilter');function syncSortControls(){const orderLabel=sortOrder==='asc'?'А—Я':'Я—А',fieldLabel=sortField==='artist'?'По исполнителю':'По названию';document.getElementById('orderValue').textContent=orderLabel;document.getElementById('fieldValue').textContent=fieldLabel;orderFilter.setAttribute('aria-label',`Порядок: ${orderLabel}`);fieldFilter.setAttribute('aria-label',`Поле сортировки: ${fieldLabel}`)}orderFilter.addEventListener('click',()=>{sortOrder=sortOrder==='asc'?'desc':'asc';syncSortControls();render()});fieldFilter.addEventListener('click',()=>{sortField=sortField==='artist'?'title':'artist';syncSortControls();render()});syncSortControls();
function updateCatalogStickyOffset(){document.documentElement.style.setProperty('--sticky-top-height','0px');document.documentElement.style.setProperty('--catalog-heading-height',`${catalogHeading.getBoundingClientRect().height}px`)}
updateCatalogStickyOffset();
if('ResizeObserver' in window){const stickyObserver=new ResizeObserver(updateCatalogStickyOffset);stickyObserver.observe(stickyTop);stickyObserver.observe(catalogHeading)}
let setlistExpanded=false;
toggleSetlist.addEventListener('click',()=>{setlistExpanded=!setlistExpanded;selectedSongs.hidden=!setlistExpanded;toggleSetlist.setAttribute('aria-expanded',String(setlistExpanded));setlistPanel.classList.toggle('expanded',setlistExpanded)});
const artistCollator=new Intl.Collator('ru',{sensitivity:'base',numeric:true});
function orderedSongs(){const primary=sortField==='artist'?'artist':'title',secondary=sortField==='artist'?'title':'artist',direction=sortOrder==='asc'?1:-1;return [...songs].sort((a,b)=>direction*(artistCollator.compare(a[primary],b[primary])||artistCollator.compare(a[secondary],b[secondary])))}
function syncSetlistItems(){const selectedKeys=new Set(songs.filter(song=>song.selected).map(songKey)),seenSongs=new Set(),seenSets=new Set(),clean=[];for(const item of setlistItems){if(item?.type==='set'&&typeof item.id==='string'&&!seenSets.has(item.id)){seenSets.add(item.id);clean.push({type:'set',id:item.id,title:typeof item.title==='string'?item.title:item.id})}else if(item?.type==='song'&&selectedKeys.has(item.key)&&!seenSongs.has(item.key)){seenSongs.add(item.key);clean.push({type:'song',key:item.key})}}for(const song of orderedSongs()){const key=songKey(song);if(song.selected&&!seenSongs.has(key)){clean.push({type:'song',key});seenSongs.add(key)}}setlistItems=clean;saveLayout()}
function setGroups(){const selectedByKey=new Map(songs.filter(song=>song.selected).map(song=>[songKey(song),song]));const groups=[];let active=null;for(const item of setlistItems){if(item.type==='set'){active={set:item,songs:[]};groups.push(active)}else if(item.type==='song'&&selectedByKey.has(item.key)){if(!active){active={set:{id:'__unassigned',title:''},songs:[]};groups.push(active)}active.songs.push(selectedByKey.get(item.key))}}return groups}
function makeDragHandle(label,disabled=false){const button=document.createElement('button');button.type='button';button.className='drag-handle';button.textContent='⠿';button.setAttribute('aria-label',label);button.title=label;button.disabled=disabled;return button}
function makeHistoryTabs(){const tabs=document.createElement('div');tabs.className='history-switch';tabs.setAttribute('role','tablist');const current=document.createElement('button');current.type='button';current.textContent='Текущий';current.setAttribute('role','tab');current.setAttribute('aria-selected',String(bottomListView==='current'));current.classList.toggle('active',bottomListView==='current');current.addEventListener('click',()=>{bottomListView='current';renderSetlist()});const history=document.createElement('button');history.type='button';history.textContent='История'+(setlistHistory.length?' · '+setlistHistory.length:'');history.setAttribute('role','tab');history.setAttribute('aria-selected',String(bottomListView==='history'));history.classList.toggle('active',bottomListView==='history');history.addEventListener('click',()=>{bottomListView='history';renderSetlist()});tabs.append(current,history);return tabs}
function archiveSongs(snapshot){const byKey=new Map((snapshot.songs||[]).map(song=>[songKey(song),song]));const ordered=[];const seen=new Set();for(const item of snapshot.items||[])if(item.type==='song'&&byKey.has(item.key)&&!seen.has(item.key)){ordered.push(byKey.get(item.key));seen.add(item.key)}for(const song of snapshot.songs||[])if(!seen.has(songKey(song)))ordered.push(song);return ordered}
function restoreSetlist(snapshot){const selectedByKey=new Map((snapshot.songs||[]).map(song=>[songKey(song),song]));songs=songs.filter(song=>!song.isSuggestion).map(song=>({...song,selected:selectedByKey.has(songKey(song))}));for(const archived of snapshot.songs||[])if(archived.isSuggestion)songs.push({...archived,selected:true});setlistItems=(snapshot.items||[]).map(item=>({...item}));syncSetlistItems();save();bottomListView='current';render();notify('Сет-лист восстановлен')}
function renderHistory(container){if(!setlistHistory.length){const empty=document.createElement('div');empty.className='history-empty';empty.textContent='История пока пуста. Список сохранится здесь после нажатия «Поделиться» или «Копировать».';container.append(empty);return}for(const snapshot of setlistHistory){const card=document.createElement('article');card.className='history-card';const top=document.createElement('div');top.className='history-card-top';const info=document.createElement('div');info.className='history-card-info';const date=document.createElement('div');date.className='history-card-date';date.textContent=new Date(snapshot.savedAt).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});const tracks=archiveSongs(snapshot);const total=tracks.reduce((sum,song)=>sum+Number(song.seconds||0),0);const meta=document.createElement('div');meta.className='history-card-meta';meta.textContent=tracks.length+' '+songWord(tracks.length)+' · '+formatDuration(total);info.append(date,meta);const restore=document.createElement('button');restore.type='button';restore.className='history-restore';restore.textContent='Восстановить';restore.addEventListener('click',()=>restoreSetlist(snapshot));top.append(info,restore);card.append(top);container.append(card)}}
function renderCurrentSetlist(container){const groups=setGroups();for(const group of groups){if(group.set.id!=='__unassigned'){const header=document.createElement('div');header.className='setlist-item setlist-set';header.dataset.kind='set';header.dataset.id=group.set.id;header.append(makeDragHandle('Перетащить '+group.set.title));const title=document.createElement('span');title.className='setlist-set-title';title.textContent=group.set.title;const total=group.songs.reduce((sum,song)=>sum+Number(song.seconds||0),0);const meta=document.createElement('span');meta.className='setlist-set-meta';meta.textContent=group.songs.length+' '+songWord(group.songs.length)+', '+formatDuration(total);header.append(title,meta);const remove=document.createElement('button');remove.type='button';remove.className='setlist-delete';remove.textContent='×';remove.setAttribute('aria-label','Удалить '+group.set.title);remove.title='Удалить '+group.set.title;header.append(remove);container.append(header)}group.songs.forEach((song,index)=>{const row=document.createElement('div');row.className='setlist-item setlist-song'+(song.isSuggestion?' suggested-song':'');row.dataset.kind='song';row.dataset.songKey=encodeURIComponent(songKey(song));const trash=document.createElement('button');trash.type='button';trash.className='setlist-trash';trash.setAttribute('aria-label','Удалить '+song.title+' из итогового списка');trash.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/></svg>';row.append(trash);const content=document.createElement('div');content.className='setlist-song-content';content.append(makeDragHandle('Перетащить '+song.title));const copy=document.createElement('div');copy.className='setlist-song-copy';const name=document.createElement('div');name.className='setlist-song-title';name.textContent=(index+1)+'. '+song.title;copy.append(name);if(song.artist){const artist=document.createElement('div');artist.className='setlist-song-artist';artist.textContent=song.artist;copy.append(artist)}const time=document.createElement('span');time.className='setlist-song-time';time.textContent=formatDuration(song.seconds);content.append(copy,time);row.append(content);container.append(row)})}if(!songs.some(song=>song.selected)){const empty=document.createElement('div');empty.className='empty';empty.textContent='Пока ничего не выбрано';container.append(empty)}const add=document.createElement('button');add.className='button setlist-add';add.type='button';add.textContent='+ Добавить сет';container.append(add)}
function renderSetlist(){for(const container of [selectedSongs,bottomSelectedSongs])container.replaceChildren();renderCurrentSetlist(selectedSongs);bottomSelectedSongs.append(makeHistoryTabs());if(bottomListView==='history')renderHistory(bottomSelectedSongs);else renderCurrentSetlist(bottomSelectedSongs);renderSuggestedTracks()}

function removeSuggestedSong(key){const song=songs.find(item=>item.isSuggestion&&songKey(item)===key);if(!song)return;songs=songs.filter(item=>songKey(item)!==key);setlistItems=setlistItems.filter(item=>item.type!=='song'||item.key!==key);syncSetlistItems();save();render();notify('Предложенная песня удалена')}
function renderSuggestedTracks(){const container=document.getElementById('suggestedTracks');const tracks=songs.filter(song=>song.isSuggestion&&song.selected);container.replaceChildren();container.hidden=!tracks.length;for(const song of tracks){const row=document.createElement('li');const text=document.createElement('span');text.textContent=`${song.title} — ${formatDuration(song.seconds)}`;const remove=document.createElement('button');remove.type='button';remove.className='suggested-track-remove';remove.textContent='×';remove.setAttribute('aria-label','Удалить предложенную песню '+song.title);remove.title='Удалить трек';remove.addEventListener('click',()=>removeSuggestedSong(songKey(song)));row.append(text,remove);container.append(row)}}
function renumberSets(){let number=0;for(const item of setlistItems)if(item.type==='set'){number++;item.id='set-'+number;item.title='Сет №'+number}}
function nextSet(){renumberSets();const number=setlistItems.filter(item=>item.type==='set').length+1;const newSet={type:'set',id:'set-'+number,title:'Сет №'+number};if(number===1)setlistItems.unshift(newSet);else setlistItems.push(newSet);saveLayout();renderSetlist();updateCatalogStickyOffset()}
function deleteSet(setId){const index=setlistItems.findIndex(item=>item.type==='set'&&item.id===setId);if(index<0)return;const nextSetIndex=setlistItems.findIndex((item,itemIndex)=>itemIndex>index&&item.type==='set');const boundary=nextSetIndex<0?setlistItems.length:nextSetIndex;const songsToKeep=setlistItems.slice(index+1,boundary).filter(item=>item.type==='song');setlistItems.splice(index,boundary-index);setlistItems.splice(index,0,...songsToKeep);renumberSets();syncSetlistItems();render();updateCatalogStickyOffset();notify('Сет удалён, песни сохранены')}
function deleteSong(key,row){row.classList.remove('revealed');row.classList.add('deleting');setTimeout(()=>{const song=songs.find(item=>songKey(item)===key);if(!song)return;if(song.isSuggestion)songs=songs.filter(item=>songKey(item)!==key);else song.selected=false;syncSetlistItems();save();render();notify('Песня удалена из итогового списка')},300)}
