<script>const storageKey='remake-setlist-yandex-v1';
const layoutStorageKey='remake-setlist-layout-v1';
let songs=[];
let setlistItems=[{type:'set',id:'set-1',title:'Set 1'}];
let catalogLoading=true,catalogError='';
function songKey(song){return `${song.artist}\u0000${song.title}`}
function readSavedSelections(){try{const saved=JSON.parse(localStorage.getItem(storageKey));return new Map(Array.isArray(saved)?saved.map(song=>[songKey(song),Boolean(song.selected)]):[])}catch{return new Map()}}
function readSavedLayout(){try{const saved=JSON.parse(localStorage.getItem(layoutStorageKey));return Array.isArray(saved)?saved:null}catch{return null}}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(songs))}catch{}}
function saveLayout(){try{localStorage.setItem(layoutStorageKey,JSON.stringify(setlistItems))}catch{}}
function parseDuration(value){const parts=String(value).trim().split(':').map(Number);if(parts.some(n=>!Number.isInteger(n)||n<0))return null;if(parts.length===2&&parts[1]<60)return parts[0]*60+parts[1];if(parts.length===3&&parts[1]<60&&parts[2]<60)return parts[0]*3600+parts[1]*60+parts[2];return null}
function parseRepertoire(text){const result=[];for(const [index,raw] of String(text).replace(/^\uFEFF/,'').split(/\r?\n/).entries()){const line=raw.trim();if(!line||line.startsWith('#'))continue;const fields=line.split('|').map(value=>value.trim());if(fields.length!==3||!fields[0]||!fields[1])throw new Error(`Строка ${index+1}: используйте формат Исполнитель | Название песни | М:СС`);const seconds=parseDuration(fields[2]);if(seconds===null)throw new Error(`Строка ${index+1}: длительность должна быть в формате М:СС`);result.push({artist:fields[0],title:fields[1],seconds,selected:false})}if(!result.length)throw new Error('В repertoire.txt нет песен');return result}
function formatDuration(seconds){seconds=Math.max(0,Math.round(seconds));const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function songWord(n){const lastTwo=n%100,last=n%10;return last===1&&lastTwo!==11?'песня':last>=2&&last<=4&&(lastTwo<12||lastTwo>14)?'песни':'песен'}
const songList=document.getElementById('songList'),selectedSongs=document.getElementById('selectedSongs'),search=document.getElementById('search'),setlistPanel=document.getElementById('setlistPanel'),toggleSetlist=document.getElementById('toggleSetlist'),stickyTop=document.querySelector('.sticky-top'),catalogHeading=document.getElementById('catalogHeading');
function updateCatalogStickyOffset(){document.documentElement.style.setProperty('--sticky-top-height',`${stickyTop.getBoundingClientRect().height}px`);document.documentElement.style.setProperty('--catalog-heading-height',`${catalogHeading.getBoundingClientRect().height}px`)}
updateCatalogStickyOffset();
if('ResizeObserver' in window){const stickyObserver=new ResizeObserver(updateCatalogStickyOffset);stickyObserver.observe(stickyTop);stickyObserver.observe(catalogHeading)}
let setlistExpanded=false;
toggleSetlist.addEventListener('click',()=>{setlistExpanded=!setlistExpanded;selectedSongs.hidden=!setlistExpanded;toggleSetlist.setAttribute('aria-expanded',String(setlistExpanded));setlistPanel.classList.toggle('expanded',setlistExpanded)});
const artistCollator=new Intl.Collator('ru',{sensitivity:'base'});
function orderedSongs(){return [...songs].sort((a,b)=>artistCollator.compare(a.artist,b.artist)||artistCollator.compare(a.title,b.title))}
function syncSetlistItems(){const selectedKeys=new Set(songs.filter(song=>song.selected).map(songKey)),seenSongs=new Set(),seenSets=new Set(),clean=[];for(const item of setlistItems){if(item?.type==='set'&&typeof item.id==='string'&&!seenSets.has(item.id)){seenSets.add(item.id);clean.push({type:'set',id:item.id,title:typeof item.title==='string'?item.title:item.id})}else if(item?.type==='song'&&selectedKeys.has(item.key)&&!seenSongs.has(item.key)){seenSongs.add(item.key);clean.push({type:'song',key:item.key})}}let firstSet=clean.findIndex(item=>item.type==='set'&&item.id==='set-1');if(firstSet<0){clean.unshift({type:'set',id:'set-1',title:'Set 1'});seenSets.add('set-1')}else if(firstSet>0){const [rootSet]=clean.splice(firstSet,1);clean.unshift(rootSet)}for(const song of orderedSongs()){const key=songKey(song);if(song.selected&&!seenSongs.has(key)){clean.push({type:'song',key});seenSongs.add(key)}}setlistItems=clean;saveLayout()}
function setGroups(){const selectedByKey=new Map(songs.filter(song=>song.selected).map(song=>[songKey(song),song]));const groups=[];let active=null;for(const item of setlistItems){if(item.type==='set'){active={set:item,songs:[]};groups.push(active)}else if(item.type==='song'&&active&&selectedByKey.has(item.key)){active.songs.push(selectedByKey.get(item.key))}}return groups}
function makeDragHandle(label,disabled=false){const button=document.createElement('button');button.type='button';button.className='drag-handle';button.textContent='⠿';button.setAttribute('aria-label',label);button.title=label;button.disabled=disabled;return button}
function renderSetlist(){selectedSongs.replaceChildren();const groups=setGroups();for(const group of groups){const header=document.createElement('div');header.className='setlist-item setlist-set';header.dataset.kind='set';header.dataset.id=group.set.id;if(group.set.id==='set-1'){const spacer=document.createElement('span');spacer.className='drag-handle-placeholder';header.append(spacer)}else header.append(makeDragHandle(`Перетащить ${group.set.title}`));const title=document.createElement('span');title.className='setlist-set-title';title.textContent=group.set.title;const total=group.songs.reduce((sum,song)=>sum+Number(song.seconds||0),0);const meta=document.createElement('span');meta.className='setlist-set-meta';meta.textContent=`${group.songs.length} ${songWord(group.songs.length)}, ${formatDuration(total)}`;header.append(title,meta);if(group.set.id!=='set-1'){const remove=document.createElement('button');remove.type='button';remove.className='setlist-delete';remove.textContent='×';remove.setAttribute('aria-label',`Удалить ${group.set.title}`);remove.title=`Удалить ${group.set.title}`;remove.addEventListener('click',()=>deleteSet(group.set.id));header.append(remove)}selectedSongs.append(header);group.songs.forEach((song,index)=>{const row=document.createElement('div');row.className='setlist-item setlist-song';row.dataset.kind='song';row.dataset.songKey=encodeURIComponent(songKey(song));row.append(makeDragHandle(`Перетащить ${song.title}`));const copy=document.createElement('div');copy.className='setlist-song-copy';const name=document.createElement('div');name.className='setlist-song-title';name.textContent=`${index+1}. ${song.title}`;const artist=document.createElement('div');artist.className='setlist-song-artist';artist.textContent=song.artist;copy.append(name,artist);const time=document.createElement('span');time.className='setlist-song-time';time.textContent=formatDuration(song.seconds);row.append(copy,time);selectedSongs.append(row)})}if(!songs.some(song=>song.selected)){const empty=document.createElement('div');empty.className='empty';empty.textContent='Пока ничего не выбрано';selectedSongs.append(empty)}const add=document.createElement('button');add.className='button setlist-add';add.id='addSet';add.type='button';add.textContent='+ Добавить сет';selectedSongs.append(add)}
function nextSet(){const numbers=setlistItems.filter(item=>item.type==='set').map(item=>Number((item.id.match(/^set-(\d+)$/)||[])[1])||0);const number=Math.max(1,...numbers)+1;setlistItems.push({type:'set',id:`set-${number}`,title:`Set ${number}`});saveLayout();renderSetlist();updateCatalogStickyOffset()}
function deleteSet(setId){if(setId==='set-1')return;const index=setlistItems.findIndex(item=>item.type==='set'&&item.id===setId);if(index<0)return;const nextSetIndex=setlistItems.findIndex((item,itemIndex)=>itemIndex>index&&item.type==='set');const boundary=nextSetIndex<0?setlistItems.length:nextSetIndex;const songsToKeep=setlistItems.slice(index+1,boundary).filter(item=>item.type==='song');setlistItems.splice(index,boundary-index);setlistItems.splice(index,0,...songsToKeep);syncSetlistItems();render();updateCatalogStickyOffset();notify('Сет удалён, песни сохранены')}
async function loadRepertoire(){catalogLoading=true;catalogError='';render();try{const url=new URL('repertoire.txt',window.location.href);url.searchParams.set('v',String(Date.now()));const response=await fetch(url.toString(),{cache:'no-store'});if(!response.ok)throw new Error('Файл repertoire.txt не найден рядом с приложением');const loaded=parseRepertoire(await response.text()),saved=readSavedSelections(),layout=readSavedLayout();songs=loaded.map(song=>({...song,selected:saved.get(songKey(song))??false}));if(layout)setlistItems=layout;syncSetlistItems();catalogLoading=false;save()}catch(error){catalogLoading=false;catalogError=error instanceof Error?error.message:'Не удалось загрузить repertoire.txt'}render()}
function render(){const q=search.value.trim().toLocaleLowerCase('ru');const ordered=orderedSongs(),visible=ordered.filter(song=>`${song.title} ${song.artist}`.toLocaleLowerCase('ru').includes(q));songList.replaceChildren();document.getElementById('catalogCount').textContent=catalogLoading?'Загрузка…':`${visible.length} из ${songs.length}`;if(catalogLoading){songList.innerHTML='<div class="empty">Загружаю репертуар…</div>'}else if(catalogError){const message=document.createElement('div');message.className='empty';message.textContent=`Не удалось загрузить каталог: ${catalogError}`;const retry=document.createElement('button');retry.className='button';retry.type='button';retry.textContent='Повторить загрузку';retry.style.marginTop='12px';retry.addEventListener('click',loadRepertoire);message.append(document.createElement('br'),retry);songList.append(message)}else if(!visible.length)songList.innerHTML='<div class="empty">Песни не найдены</div>';for(const song of visible){const row=document.createElement('label');row.className=`song${song.selected?' selected':''}`;const check=document.createElement('input');check.type='checkbox';check.checked=!!song.selected;check.setAttribute('aria-label',`Выбрать ${song.title}`);check.addEventListener('change',()=>{song.selected=check.checked;syncSetlistItems();save();render()});const info=document.createElement('div');info.className='song-main';const name=document.createElement('div');name.className='song-name';name.textContent=song.title;const artist=document.createElement('div');artist.className='song-artist';artist.textContent=song.artist;info.append(name,artist);const time=document.createElement('span');time.className='duration';time.textContent=formatDuration(song.seconds);time.setAttribute('aria-label',`Длительность песни ${formatDuration(song.seconds)}`);row.append(check,info,time);songList.append(row)}const chosen=ordered.filter(song=>song.selected),total=chosen.reduce((sum,song)=>sum+Number(song.seconds||0),0);document.getElementById('songCount').textContent=chosen.length;document.getElementById('totalTime').textContent=formatDuration(total);document.getElementById('selectionSummary').textContent=`${chosen.length} ${songWord(chosen.length)} · ${formatDuration(total)}`;renderSetlist();}
search.addEventListener('input',render);
document.getElementById('clearSelection').addEventListener('click',()=>{songs.forEach(song=>song.selected=false);syncSetlistItems();save();render()});
selectedSongs.addEventListener('click',event=>{if(event.target.closest('#addSet'))nextSet()});
let activeSwipe=null;
selectedSongs.addEventListener('pointerdown',event=>{const row=event.target.closest('.setlist-song');if(!row||event.target.closest('.drag-handle'))return;activeSwipe={row,x:event.clientX,y:event.clientY,pointerId:event.pointerId};try{row.setPointerCapture(event.pointerId)}catch{}});
selectedSongs.addEventListener('pointerup',event=>{const swipe=activeSwipe;if(!swipe||swipe.pointerId!==event.pointerId)return;activeSwipe=null;const dx=event.clientX-swipe.x,dy=event.clientY-swipe.y;if(dx>-70||Math.abs(dx)<Math.abs(dy)*1.25)return;const row=swipe.row,key=decodeURIComponent(row.dataset.songKey);row.classList.add('deleting');setTimeout(()=>{const song=songs.find(item=>songKey(item)===key);if(!song)return;song.selected=false;syncSetlistItems();save();render();notify('Песня удалена из итогового списка')},180)});
selectedSongs.addEventListener('pointercancel',()=>{activeSwipe=null});
let activeDrag=null;
selectedSongs.addEventListener('pointerdown',event=>{const handle=event.target.closest('.drag-handle');if(!handle||handle.disabled)return;const row=handle.closest('.setlist-item');if(!row)return;activeDrag={row,pointerId:event.pointerId};row.classList.add('dragging');try{handle.setPointerCapture(event.pointerId)}catch{}event.preventDefault()});
selectedSongs.addEventListener('pointermove',event=>{if(!activeDrag||activeDrag.pointerId!==event.pointerId)return;const bounds=selectedSongs.getBoundingClientRect();if(event.clientY<bounds.top+26)selectedSongs.scrollTop-=14;else if(event.clientY>bounds.bottom-26)selectedSongs.scrollTop+=14;const hit=document.elementFromPoint(event.clientX,event.clientY);const target=hit?.closest('.setlist-item');if(!target||target===activeDrag.row||!selectedSongs.contains(target))return;const box=target.getBoundingClientRect();let before=event.clientY<box.top+box.height/2;if(target.dataset.kind==='set'&&target.dataset.id==='set-1')before=false;selectedSongs.insertBefore(activeDrag.row,before?target:target.nextSibling)});
function finishDrag(event){if(!activeDrag||activeDrag.pointerId!==event.pointerId)return;activeDrag.row.classList.remove('dragging');setlistItems=[...selectedSongs.querySelectorAll('.setlist-item')].map(row=>row.dataset.kind==='set'?{type:'set',id:row.dataset.id,title:row.querySelector('.setlist-set-title').textContent}:{type:'song',key:decodeURIComponent(row.dataset.songKey)});activeDrag=null;syncSetlistItems();render();updateCatalogStickyOffset()}
selectedSongs.addEventListener('pointerup',finishDrag);selectedSongs.addEventListener('pointercancel',finishDrag);
function buildSetlistText(){const groups=setGroups().filter(group=>group.songs.length),chosen=songs.filter(song=>song.selected),total=chosen.reduce((sum,song)=>sum+Number(song.seconds||0),0),lines=['Сет-лист Remake'];for(const group of groups){const groupTotal=group.songs.reduce((sum,song)=>sum+Number(song.seconds||0),0);lines.push('',`${group.set.title} — ${group.songs.length} ${songWord(group.songs.length)}, ${formatDuration(groupTotal)}`);group.songs.forEach((song,index)=>lines.push(`${index+1}. ${song.title} — ${song.artist} (${formatDuration(song.seconds)})`))}lines.push('',`Итого: ${chosen.length} ${songWord(chosen.length)} · ${formatDuration(total)}`);return lines.join('\n')}
document.getElementById('copyList').addEventListener('click',async()=>{const chosen=songs.filter(song=>song.selected);if(!chosen.length)return notify('Сначала выбери песни');try{await navigator.clipboard.writeText(buildSetlistText());notify('Список скопирован')}catch{notify('Не удалось скопировать список')}});
document.getElementById('downloadList').addEventListener('click',()=>{const chosen=songs.filter(song=>song.selected);if(!chosen.length)return notify('Сначала выбери песни');const blob=new Blob(['\ufeff',buildSetlistText()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='set-list-remake.txt';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Список скачан')});
function notify(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1900)}
const themeMedia=window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const webApp=window.Telegram?.WebApp;const theme=webApp?.colorScheme||(themeMedia.matches?'dark':'light');document.documentElement.dataset.theme=theme;const background=webApp?.themeParams?.bg_color||(theme==='dark'?'#111116':'#f4f4f5');document.querySelector('meta[name="theme-color"]').setAttribute('content',background)}
applyTheme();
themeMedia.addEventListener?.('change',applyTheme);
if(window.Telegram?.WebApp){Telegram.WebApp.onEvent('themeChanged',applyTheme);Telegram.WebApp.ready();Telegram.WebApp.expand()}
render();
loadRepertoire();</script></body></html>
